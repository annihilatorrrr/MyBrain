name: Publish Signed Android Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build and attach signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Verify and prepare APK
        id: apk
        env:
          TAG: ${{ github.event.release.tag_name }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' androidApp/build.gradle.kts)"
          test "$TAG" = "v$VERSION_NAME"
          test -n "$EXPECTED_CERT_SHA256"

          mkdir dist
          APK="dist/MyBrain-$TAG.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          EXPECTED_CERT_SHA256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          (
            cd dist
            sha256sum "MyBrain-$TAG.apk" > "MyBrain-$TAG.apk.sha256"
          )

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: gh release upload "$TAG" "$APK_PATH" "$APK_PATH.sha256"
